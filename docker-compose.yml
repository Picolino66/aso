# Stack completa do ASO Runtime (ADR-0004/0006).
# `docker compose up --build` sobe Postgres + API (migrations aplicadas no start).
# Tudo roda em container — sem necessidade de Python/Postgres na máquina.
services:
  postgres:
    image: postgres:16
    container_name: aso-postgres
    environment:
      POSTGRES_USER: aso
      # Senha por variável (regra 9); o default `aso` só vale para uso local.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aso}"
      POSTGRES_DB: aso
    # Só na interface local (ADR-0057): o banco não fica exposto na rede.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aso -d aso"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    container_name: aso-api
    environment:
      ASO_DATABASE_URL: "postgresql+psycopg://aso:${POSTGRES_PASSWORD:-aso}@postgres:5432/aso"
      ASO_API_KEYS: "${ASO_API_KEYS:-}"
      # Modo dev explícito (ADR-0057): sem ASO_API_KEYS a API só sobe com ASO_DEV_MODE=1.
      # O compose é de uso local (portas só em 127.0.0.1), por isso liga por padrão;
      # para expor, defina ASO_API_KEYS e ASO_DEV_MODE=0.
      ASO_DEV_MODE: "${ASO_DEV_MODE:-1}"
      # Raízes onde a API pode ler/criar workspaces (ADR-0057); o smoke usa /tmp.
      ASO_WORKSPACE_ROOTS: "${ASO_WORKSPACE_ROOTS:-/tmp}"
      # Execução assíncrona (ADR-0067): rotas que acionam agentes respondem 202 + job.
      ASO_EXECUCAO_ASSINCRONA: "${ASO_EXECUCAO_ASSINCRONA:-1}"
      ASO_WORKERS: "${ASO_WORKERS:-2}"
      ASO_RATE_LIMIT: "${ASO_RATE_LIMIT:-0}"
      ASO_OTEL: "${ASO_OTEL:-0}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  aso_pgdata:
