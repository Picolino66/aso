<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASO Runtime — Orquestração</title>
  <style>
    :root {
      --bg:#0f172a; --panel:#1e293b; --panel2:#0b1220; --border:#334155;
      --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e;
      --warn:#f59e0b; --err:#ef4444; --info:#818cf8; --radius:10px;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--fg); }
    button, input, select { font:inherit; }
    button { border:0; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:650; cursor:pointer; background:var(--accent); color:#08131f; }
    button:hover { opacity:.86; } button:disabled { opacity:.45; cursor:not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button.ghost { background:var(--border); color:var(--fg); } button.ok { background:var(--ok); }
    button.err { background:var(--err); color:#fff; } button.info { background:var(--info); color:#fff; }
    button.sm { padding:5px 9px; font-size:12px; } button.big { padding:11px 18px; font-size:14px; }
    input, select { width:100%; padding:8px 10px; color:var(--fg); background:var(--panel2); border:1px solid var(--border); border-radius:8px; }
    a { color:var(--accent); }
    header { position:sticky; top:0; z-index:5; padding:12px 24px; background:var(--panel); border-bottom:1px solid var(--border); }
    .crumbs { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted); }
    .headline-row { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-top:6px; }
    .headline-row h1 { margin:0; font-size:19px; flex:1; min-width:220px; }
    .facts { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    main { display:grid; grid-template-columns:1fr 320px; gap:16px; padding:16px 24px 28px; align-items:start; }
    .card { padding:15px; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel); margin-bottom:16px; }
    .card > h2 { margin:0 0 12px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
    .muted { color:var(--muted); font-size:12px; }
    .pill { display:inline-block; border-radius:999px; padding:2px 9px; font-size:11px; background:var(--border); color:var(--fg); }
    .pill.ok { background:rgba(34,197,94,.18); color:var(--ok); }
    .pill.err { background:rgba(239,68,68,.18); color:var(--err); }
    .pill.warn { background:rgba(245,158,11,.18); color:var(--warn); }
    .pill.info { background:rgba(129,140,248,.18); color:var(--info); }
    .pill.accent { background:rgba(56,189,248,.18); color:var(--accent); }
    /* Esteira F1→F7 */
    .esteira { display:flex; gap:0; overflow-x:auto; padding-bottom:4px; }
    .fase { flex:1 0 108px; padding:9px 10px; border-top:3px solid var(--border); margin-right:6px; }
    .fase.feita { border-top-color:var(--ok); } .fase.atual { border-top-color:var(--accent); background:var(--panel2); border-radius:0 0 8px 8px; }
    .fase b { display:block; font-size:13px; } .fase span { font-size:11px; color:var(--muted); }
    /* Próximo passo */
    .hero { border-color:var(--accent); }
    .hero h3 { margin:0 0 4px; font-size:18px; }
    .checklist { list-style:none; margin:14px 0 0; padding:0; }
    .checklist li { display:flex; gap:9px; align-items:baseline; padding:5px 0; font-size:13px; color:var(--muted); }
    .checklist li .ico { width:16px; text-align:center; }
    .checklist li.ok { color:var(--fg); } .checklist li.ok .ico { color:var(--ok); }
    .checklist li.atual { color:var(--fg); font-weight:650; } .checklist li.atual .ico { color:var(--accent); }
    .checklist li.falha { color:var(--err); }
    .checklist li .aqui { font-size:11px; font-weight:400; color:var(--accent); }
    .acoes { display:flex; gap:9px; flex-wrap:wrap; margin-top:16px; align-items:center; }
    .progresso { height:8px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); overflow:hidden; margin-top:12px; }
    .progresso > div { height:100%; background:var(--ok); width:0; transition:width .2s ease; }
    /* Cards da fase */
    .grupo { margin-bottom:14px; }
    .grupo h4 { margin:0 0 7px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
    .kcard { padding:11px; border:1px solid var(--border); border-radius:9px; background:var(--panel2); margin-bottom:8px; }
    .kcard strong { display:block; font-size:13.5px; margin-bottom:3px; }
    .kcard .acoes { margin-top:9px; gap:6px; }
    .motivo { margin-top:7px; padding:5px 8px; border-radius:6px; font-size:12px; color:var(--err); background:rgba(239,68,68,.1); }
    /* Pendências */
    .bloq { display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border); }
    .bloq:last-child { border-bottom:0; } .bloq .txt { flex:1; min-width:0; }
    .bloq strong { display:block; font-size:13.5px; margin-bottom:2px; }
    /* Atividade */
    .evt { display:flex; gap:8px; padding:4px 0; font-size:12px; color:var(--muted); border-bottom:1px solid #1f2b3e; }
    .evt b { color:var(--fg); font-weight:600; }
    /* Config / overlay */
    .overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(2,6,23,.78); }
    .modal { width:min(520px,100%); max-height:88vh; overflow:auto; padding:20px; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel); }
    .modal h2 { margin:0 0 6px; font-size:17px; }
    .modal label { display:block; margin:13px 0 5px; font-size:12px; color:var(--muted); }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
    details.tecnico summary { cursor:pointer; font-size:13px; color:var(--muted); }
    details.tecnico .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:12px; }
    details.tecnico .grid div { padding:9px; border:1px solid var(--border); border-radius:8px; background:var(--panel2); }
    details.tecnico .grid b { display:block; font-size:17px; }
    .empty { padding:18px; text-align:center; color:var(--muted); font-size:13px; }
    @media (max-width:900px) { main { grid-template-columns:1fr; } header, main { padding-left:13px; padding-right:13px; } }
  </style>
</head>
<body>
  <header>
    <div class="crumbs" id="crumbs"></div>
    <div class="headline-row">
      <h1 id="titulo">Carregando orquestração…</h1>
      <div style="display:flex;gap:7px;align-items:center">
        <input id="token" aria-label="Token Bearer" placeholder="token (Bearer)" style="width:150px">
        <button id="login" class="ghost sm">Entrar</button>
        <button id="config" class="ghost sm">⚙ Configurações</button>
      </div>
    </div>
    <div class="facts" id="facts"></div>
  </header>
  <main>
    <div>
      <section class="card"><h2>Esteira F1 → F7</h2><div class="esteira" id="esteira"></div></section>
      <section class="card hero" id="proximo"><div class="empty">Calculando o próximo passo…</div></section>
      <section class="card" id="fase"></section>
      <section class="card" id="pendencias"></section>
      <details class="tecnico card">
        <summary>Detalhes técnicos — ADRs, snapshots, patches, auditoria, SLO e custos</summary>
        <div class="grid" id="tecnico"></div>
        <div class="muted" style="margin-top:12px">
          Auditoria completa (patches, conflitos, corridas de candidatos, diffs de snapshot):
          <a id="linkConsole" href="/ui/console">console técnico</a> · <a href="/docs" target="_blank">API</a>.
        </div>
      </details>
    </div>
    <aside>
      <section class="card"><h2>Atividade ao vivo</h2><div id="atividade"><div class="empty">—</div></div></section>
    </aside>
  </main>

  <script>
    const ID = new URLSearchParams(location.search).get('id');
    const ORDEM_FUNIL = ['Blocked','Failed','WaitingHuman','Ready','Backlog','InProgress','WaitingAgent','Planning','Review','Testing','Done','Archived'];
    const ICONE = { ok:'✓', atual:'▸', pendente:'○', falha:'✗' };
    const SEVERIDADE = {
      bloqueia:       { pill:'err',    rotulo:'bloqueia' },
      aguardando_humano:{ pill:'warn', rotulo:'aguarda humano' },
      acao_do_operador:{ pill:'accent',rotulo:'sua vez' },
      informativo:    { pill:'info',   rotulo:'aviso' },
    };
    // Ações longas mandam o agente/esforço escolhido junto (o runtime propaga na esteira).
    const COM_EXECUTOR = ['/run-phase','/autopilot','/analyze-folder','/docs-heal'];
    let estado = { orch:null, step:null, cards:[], projeto:null, eventos:[], metrics:null, execs:[] };
    let fonteEventos = null, recarregando = false;

    function token() { return localStorage.getItem('aso_token') || ''; }
    async function api(path, options) {
      const opts = options || {};
      const headers = Object.assign({}, opts.headers || {});
      if (token()) headers.Authorization = 'Bearer ' + token();
      const resposta = await fetch(path, Object.assign({}, opts, { headers }));
      if (!resposta.ok) {
        let detalhe = 'HTTP ' + resposta.status;
        try { detalhe = (await resposta.json()).detail || detalhe; } catch (_) {}
        throw new Error(detalhe);
      }
      return resposta.status === 204 ? null : resposta.json();
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function botao(rotulo, className, handler) {
      const node = el('button', className, rotulo);
      node.type = 'button';
      node.addEventListener('click', function(evento) { evento.preventDefault(); handler(node); });
      return node;
    }
    function pill(texto, tipo) { return el('span', 'pill' + (tipo ? ' ' + tipo : ''), texto); }
    function secao(alvo, titulo) {
      const node = document.getElementById(alvo);
      node.replaceChildren();
      if (titulo) node.appendChild(el('h2', '', titulo));
      return node;
    }

    // ------------------------------------------------------------- carregamento
    async function carregar() {
      if (recarregando) return;
      recarregando = true;
      try {
        const [orch, step, cards, timeline, metrics] = await Promise.all([
          api('/v1/orchestrations/' + encodeURIComponent(ID)),
          api('/v1/orchestrations/' + encodeURIComponent(ID) + '/next-step'),
          api('/v1/orchestrations/' + encodeURIComponent(ID) + '/cards'),
          api('/v1/orchestrations/' + encodeURIComponent(ID) + '/timeline?page_size=14').catch(function() { return {items:[]}; }),
          api('/v1/orchestrations/' + encodeURIComponent(ID) + '/metrics').catch(function() { return null; }),
        ]);
        estado.orch = orch; estado.step = step; estado.cards = cards;
        estado.eventos = (timeline && timeline.items) || []; estado.metrics = metrics;
        if (orch.project_id && (!estado.projeto || estado.projeto.id !== orch.project_id)) {
          estado.projeto = await api('/v1/projects/' + encodeURIComponent(orch.project_id)).catch(function() { return null; });
        }
        renderizar();
        assinarEventos();
      } catch (erro) {
        document.getElementById('titulo').textContent = 'Não foi possível carregar: ' + erro.message;
      } finally { recarregando = false; }
    }

    function assinarEventos() {
      if (fonteEventos) return;
      const t = token();
      fonteEventos = new EventSource('/v1/orchestrations/' + encodeURIComponent(ID) + '/events/stream' + (t ? '?token=' + encodeURIComponent(t) : ''));
      fonteEventos.onmessage = function() { carregar(); };
      fonteEventos.onerror = function() { fonteEventos.close(); fonteEventos = null; };
    }

    function renderizar() {
      renderCabecalho(); renderEsteira(); renderProximoPasso();
      renderFase(); renderPendencias(); renderAtividade(); renderTecnico();
    }

    // ------------------------------------------------------------- cabeçalho
    function renderCabecalho() {
      const orch = estado.orch, step = estado.step;
      const crumbs = document.getElementById('crumbs');
      crumbs.replaceChildren();
      const voltar = el('a', '', '← Projetos'); voltar.href = '/ui/';
      crumbs.appendChild(voltar);
      if (estado.projeto) {
        crumbs.appendChild(el('span', '', '/'));
        crumbs.appendChild(el('span', '', '📁 ' + estado.projeto.name));
      }
      document.getElementById('titulo').textContent = orch.user_request || orch.id;
      const facts = document.getElementById('facts');
      facts.replaceChildren();
      facts.appendChild(pill(step.phase + ' · ' + step.phase_label, 'accent'));
      facts.appendChild(pill('status: ' + orch.status, orch.status === 'running' ? 'ok' : orch.status === 'cancelled' ? 'err' : ''));
      facts.appendChild(pill('snapshot ' + orch.snapshot_version));
      facts.appendChild(pill('agente: ' + (orch.selected_executor || 'default') + (orch.selected_effort ? ' · ' + orch.selected_effort : '')));
      if (orch.target_path) facts.appendChild(pill('📂 ' + orch.target_path));
      if (fonteEventos) facts.appendChild(pill('● ao vivo', 'ok'));
      document.getElementById('linkConsole').href = '/ui/console';
    }

    // ------------------------------------------------------------- esteira
    function renderEsteira() {
      const alvo = secao('esteira');
      const fases = ['F1','F2','F3','F4','F5','F6','F7'];
      const atual = fases.indexOf(estado.step.phase);
      fases.forEach(function(fase, indice) {
        const classe = indice < atual ? 'fase feita' : indice === atual ? 'fase atual' : 'fase';
        const node = el('div', classe);
        node.appendChild(el('b', '', (indice < atual ? '✓ ' : indice === atual ? '● ' : '○ ') + fase));
        node.appendChild(el('span', '', indice === atual ? estado.step.phase_label : ''));
        alvo.appendChild(node);
      });
    }

    // ------------------------------------------------------------- próximo passo
    function renderProximoPasso() {
      const step = estado.step;
      const alvo = document.getElementById('proximo');
      alvo.replaceChildren();
      alvo.appendChild(el('h2', '', '▶ Próximo passo'));
      alvo.appendChild(el('h3', '', step.headline));
      if (step.explanation) alvo.appendChild(el('div', 'muted', step.explanation));

      if (step.cards_total) {
        const barra = el('div', 'progresso');
        const preenchida = el('div');
        preenchida.style.width = Math.round(100 * step.cards_done / step.cards_total) + '%';
        barra.appendChild(preenchida); alvo.appendChild(barra);
        alvo.appendChild(el('div', 'muted', step.cards_done + ' de ' + step.cards_total + ' card(s) da fase entregues'));
      }

      const lista = el('ul', 'checklist');
      step.checklist.forEach(function(item) {
        const linha = el('li', item.state);
        linha.appendChild(el('span', 'ico', ICONE[item.state] || '○'));
        const texto = el('span', '', item.label);
        linha.appendChild(texto);
        if (item.state === 'atual') linha.appendChild(el('span', 'aqui', '← você está aqui'));
        lista.appendChild(linha);
      });
      alvo.appendChild(lista);

      const acoes = el('div', 'acoes');
      if (step.primary_action) acoes.appendChild(acaoBotao(step.primary_action, 'big'));
      acoes.appendChild(botao('▶ Autopilot', 'ghost', function(node) {
        executar({ label:'Autopilot', method:'POST', path:'/v1/orchestrations/' + ID + '/autopilot' }, node);
      }));
      if (estado.orch.target_path) {
        acoes.appendChild(botao('🔄 Sincronizar docs', 'ghost', function(node) {
          executar({ label:'Sincronizar docs', method:'POST', path:'/v1/orchestrations/' + ID + '/docs-heal' }, node);
        }));
      }
      alvo.appendChild(acoes);
      alvo.appendChild(el('div', 'muted', 'O Autopilot roda a fase inteira e pausa em toda ação que exige decisão humana (aprovação, PR, CI, revisão, merge).'));
      const aviso = el('div', 'muted'); aviso.id = 'avisoAcao'; aviso.style.marginTop = '6px';
      alvo.appendChild(aviso);
    }

    function acaoBotao(acao, extra) {
      const classe = (acao.role === 'admin' ? 'ok' : '') + (extra ? ' ' + extra : '') + ' sm';
      const rotulo = acao.label + (acao.role === 'admin' ? ' (admin)' : '');
      return botao(rotulo, classe.trim(), function(node) { executar(acao, node); });
    }

    async function executar(acao, node) {
      // Ajuste de configuração não é chamada direta: abre o painel para o operador preencher.
      if (acao.method === 'PATCH' && acao.path.endsWith('/execution-settings')) { abrirConfig(); return; }
      const aviso = document.getElementById('avisoAcao');
      const corpo = Object.assign({}, acao.body || {});
      if (COM_EXECUTOR.some(function(sufixo) { return acao.path.endsWith(sufixo); })) {
        corpo.executor = estado.orch.selected_executor || null;
        corpo.effort = estado.orch.selected_effort || null;
      }
      if (node) node.disabled = true;
      if (aviso) aviso.textContent = 'Executando "' + acao.label + '" — isso pode levar alguns minutos…';
      try {
        await api(acao.path, {
          method: acao.method || 'POST',
          headers: { 'content-type':'application/json' },
          body: JSON.stringify(corpo),
        });
        if (aviso) aviso.textContent = '';
        await carregar();
      } catch (erro) {
        if (aviso) aviso.textContent = 'Falha em "' + acao.label + '": ' + erro.message;
      } finally { if (node) node.disabled = false; }
    }

    // ------------------------------------------------------------- fase atual
    function renderFase() {
      const step = estado.step;
      const alvo = secao('fase', 'Etapa atual — ' + step.phase + ' · ' + step.phase_label);
      const daFase = estado.cards.filter(function(card) { return card.phase === step.phase; });
      if (!daFase.length) {
        alvo.appendChild(el('div', 'empty', 'Nenhum card nesta fase. Rodar a fase avalia o gate e abre a aprovação de avanço.'));
        return;
      }
      ORDEM_FUNIL.forEach(function(coluna) {
        const items = daFase.filter(function(card) { return card.status === coluna; });
        if (!items.length) return;
        const grupo = el('div', 'grupo');
        grupo.appendChild(el('h4', '', coluna + ' · ' + items.length));
        items.forEach(function(card) { grupo.appendChild(cardNode(card)); });
        alvo.appendChild(grupo);
      });
      const outras = estado.cards.length - daFase.length;
      if (outras > 0) alvo.appendChild(el('div', 'muted', outras + ' card(s) em outras fases da esteira.'));
    }

    function cardNode(card) {
      const node = el('div', 'kcard');
      node.appendChild(el('div', 'muted', (card.type || 'Task') + ' · ' + (card.assignee || 'sem agente') + ' · ' + card.phase));
      node.appendChild(el('strong', '', card.title));
      if (card.description) node.appendChild(el('div', 'muted', card.description));
      if (card.block_reason) node.appendChild(el('div', 'motivo', '⚠ ' + card.block_reason));
      const acoes = el('div', 'acoes');
      const base = '/v1/orchestrations/' + ID + '/cards/' + card.id;
      if (card.status === 'Backlog') {
        acoes.appendChild(acaoBotao({ label:'▶ Liberar para a IA', method:'POST', path:base + '/move', body:{ to_column:'Ready' } }));
      }
      if (card.status === 'Ready') {
        acoes.appendChild(acaoBotao({ label:'▶ Executar card', method:'POST', path:base + '/run' }));
      }
      if (card.status === 'Blocked') {
        acoes.appendChild(acaoBotao({ label:'Desbloquear', method:'POST', path:base + '/unblock' }));
      }
      if (['Testing','Review','WaitingHuman'].indexOf(card.status) >= 0) {
        acoes.appendChild(acaoBotao({ label:'Abrir PR', method:'POST', path:base + '/open-pr' }));
      }
      if (acoes.children.length) node.appendChild(acoes);
      return node;
    }

    // ------------------------------------------------------------- pendências
    function renderPendencias() {
      const bloqueios = estado.step.blockers || [];
      const alvo = secao('pendencias', 'Pendências de governança (' + bloqueios.length + ')');
      if (!bloqueios.length) {
        alvo.appendChild(el('div', 'empty', 'Nenhuma pendência — a esteira está livre para avançar.'));
        return;
      }
      bloqueios.forEach(function(bloqueio) {
        const meta = SEVERIDADE[bloqueio.severity] || { pill:'', rotulo:bloqueio.severity };
        const linha = el('div', 'bloq');
        linha.appendChild(pill(meta.rotulo, meta.pill));
        const texto = el('div', 'txt');
        texto.appendChild(el('strong', '', bloqueio.title));
        if (bloqueio.detail) texto.appendChild(el('div', 'muted', bloqueio.detail));
        linha.appendChild(texto);
        if (bloqueio.action) linha.appendChild(acaoBotao(bloqueio.action));
        alvo.appendChild(linha);
      });
    }

    // ------------------------------------------------------------- atividade
    function renderAtividade() {
      const alvo = document.getElementById('atividade');
      alvo.replaceChildren();
      if (!estado.eventos.length) { alvo.appendChild(el('div', 'empty', 'Sem eventos ainda.')); return; }
      estado.eventos.slice().reverse().forEach(function(evento) {
        const linha = el('div', 'evt');
        linha.appendChild(el('span', '', (evento.created_at || '').slice(11, 19)));
        linha.appendChild(el('b', '', evento.type));
        alvo.appendChild(linha);
      });
    }

    function renderTecnico() {
      const alvo = document.getElementById('tecnico');
      alvo.replaceChildren();
      const m = estado.metrics || {};
      const numeros = [
        ['cards', m.cards_total], ['ADRs', m.adrs_total], ['snapshots', m.snapshots_total],
        ['conflitos', m.open_conflicts], ['fase', m.phase], ['snapshot', m.snapshot_version],
      ];
      numeros.forEach(function(par) {
        const caixa = el('div');
        caixa.appendChild(el('b', '', par[1] === undefined || par[1] === null ? '—' : String(par[1])));
        caixa.appendChild(el('span', 'muted', par[0]));
        alvo.appendChild(caixa);
      });
    }

    // ------------------------------------------------------------- configurações
    async function abrirConfig() {
      const overlay = el('div', 'overlay');
      const modal = el('div', 'modal');
      modal.setAttribute('role', 'dialog'); modal.setAttribute('aria-modal', 'true');
      modal.appendChild(el('h2', '', 'Configurações da execução'));
      modal.appendChild(el('div', 'muted', 'Valem para esta orquestração — o agente escolhido roda todas as fases até você trocar.'));

      modal.appendChild(el('label', '', 'Agente'));
      const agente = el('select'); modal.appendChild(agente);
      modal.appendChild(el('label', '', 'Esforço'));
      const esforco = el('select'); modal.appendChild(esforco);
      modal.appendChild(el('label', '', 'Comando de validação (testes/build)'));
      const validacao = el('input');
      validacao.placeholder = 'ex.: npm run build';
      validacao.value = estado.orch.validation_command || '';
      modal.appendChild(validacao);
      const erro = el('div', 'muted'); erro.style.color = 'var(--err)'; modal.appendChild(erro);

      try { estado.execs = await api('/v1/executors'); } catch (_) { estado.execs = []; }
      const padrao = el('option', '', 'default'); padrao.value = ''; agente.appendChild(padrao);
      estado.execs.forEach(function(perfil) {
        const item = el('option', '', perfil.name + (perfil.model ? ' · ' + perfil.model : '') + (perfil.available ? '' : ' · indisponível'));
        item.value = perfil.name; item.disabled = !perfil.available;
        item.selected = perfil.name === estado.orch.selected_executor;
        agente.appendChild(item);
      });
      function atualizarEsforcos() {
        const perfil = estado.execs.find(function(p) { return p.name === agente.value; });
        const opcoes = (perfil && perfil.supported_efforts && perfil.supported_efforts.length) ? perfil.supported_efforts : ['low','medium','high'];
        esforco.replaceChildren();
        opcoes.forEach(function(valor) {
          const item = el('option', '', valor); item.value = valor;
          item.selected = valor === (estado.orch.selected_effort || (perfil && perfil.effort));
          esforco.appendChild(item);
        });
      }
      agente.addEventListener('change', atualizarEsforcos); atualizarEsforcos();

      const acoes = el('div', 'modal-actions');
      acoes.appendChild(botao('Cancelar', 'ghost', function() { overlay.remove(); }));
      acoes.appendChild(botao('Salvar', 'ok', async function(node) {
        node.disabled = true; erro.textContent = '';
        try {
          await api('/v1/orchestrations/' + encodeURIComponent(ID) + '/execution-settings', {
            method:'PATCH', headers:{ 'content-type':'application/json' },
            body: JSON.stringify({ executor: agente.value || null, effort: esforco.value || null, validation_command: validacao.value.trim() || null }),
          });
          overlay.remove(); await carregar();
        } catch (causa) { erro.textContent = causa.message; node.disabled = false; }
      }));
      modal.appendChild(acoes);
      overlay.appendChild(modal); document.body.appendChild(overlay);
    }

    // ------------------------------------------------------------- boot
    if (!ID) { location.href = '/ui/'; }
    else {
      document.getElementById('token').value = token();
      document.getElementById('login').addEventListener('click', function() {
        localStorage.setItem('aso_token', document.getElementById('token').value.trim());
        if (fonteEventos) { fonteEventos.close(); fonteEventos = null; }
        carregar();
      });
      document.getElementById('config').addEventListener('click', abrirConfig);
      carregar();
    }
  </script>
</body>
</html>
