<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASO Runtime — Code Reviews</title>
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/components.css">
  <style>
    body { display:flex; flex-direction:column; min-height:100vh; }
    .picker-item { padding:8px 0; border-bottom:1px solid var(--border); }
  </style>
</head>
<body>
  <header id="app-header"></header>
  <div class="shell">
    <nav id="app-sidebar"></nav>
    <main>
      <div id="semDemanda" hidden>
        <section class="card">
          <h2>Code Reviews</h2>
          <p class="muted">Escolha uma demanda para ver as pull requests e revisões dela.</p>
          <div id="listaPicker"><div class="empty">Carregando…</div></div>
        </section>
      </div>

      <div id="comDemanda" hidden>
        <section class="card">
          <div class="row between">
            <h2 style="margin:0">Code Reviews</h2>
            <a href="#" id="linkDemanda">← voltar para a demanda</a>
          </div>
          <p class="muted">Resumo, checklist de 12 eixos e comentários ancorados (wf §20) ficam na ficha do card, aba Review.</p>
          <table><tr><th>Card</th><th>PR</th><th>CI</th><th>Revisão</th><th>Rodadas</th><th></th></tr>
            <tbody id="linhas"></tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script src="/ui/header.js"></script>
  <script src="/ui/sidebar.js"></script>
  <script>
    const ID = new URLSearchParams(location.search).get('id');
    ASOHeader.mount(document.getElementById('app-header'), ID ? { orchestrationId: ID } : {});
    ASOSidebar.mount(document.getElementById('app-sidebar'), { active: 'code-reviews' });

    function token() { return localStorage.getItem('aso_token') || ''; }
    async function api(path) {
      const headers = {};
      if (token()) headers.Authorization = 'Bearer ' + token();
      const r = await fetch(path, { headers: headers });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    async function carregarPicker() {
      const container = document.getElementById('listaPicker');
      try {
        const orquestracoes = await api('/v1/orchestrations');
        if (!orquestracoes.length) { container.innerHTML = '<div class="empty">Nenhuma demanda ainda.</div>'; return; }
        container.innerHTML = orquestracoes.slice(0, 30).map(function (o) {
          return '<div class="picker-item"><a href="/ui/code-reviews?id=' + encodeURIComponent(o.id) + '">' +
            esc((o.user_request || o.id).slice(0, 80)) + '</a></div>';
        }).join('');
      } catch (e) { container.innerHTML = '<div class="empty">Falha ao carregar demandas.</div>'; }
    }

    async function carregarLista() {
      const [pulls, cards] = await Promise.all([
        api('/v1/orchestrations/' + encodeURIComponent(ID) + '/pulls'),
        api('/v1/orchestrations/' + encodeURIComponent(ID) + '/cards'),
      ]);
      function tituloDeCard(cardId) {
        const c = cards.find(function (c) { return c.id === cardId; });
        return c ? c.title : (cardId || '—');
      }
      document.getElementById('linhas').innerHTML = pulls.length ? pulls.map(function (p) {
        return '<tr><td>' + esc(tituloDeCard(p.card_id)) + '</td><td>' + esc(p.title || p.branch) + '</td>' +
          '<td><span class="pill ' + (p.ci_status === 'passed' ? 'ok' : p.ci_status === 'failed' ? 'err' : 'warn') + '">' + esc(p.ci_status) + '</span></td>' +
          '<td><span class="pill ' + (p.review_status === 'approved' ? 'ok' : p.review_status === 'changes_requested' ? 'err' : 'warn') + '">' + esc(p.review_status) + '</span></td>' +
          '<td>' + p.review_rounds + '</td>' +
          '<td>' + (p.card_id ? '<a href="/ui/card-detalhe?id=' + encodeURIComponent(ID) + '&card=' + encodeURIComponent(p.card_id) + '">ver review</a>' : '—') + '</td></tr>';
      }).join('') : '<tr><td colspan="6"><div class="empty">Nenhuma pull request ainda.</div></td></tr>';
    }

    async function carregar() {
      if (!ID) {
        document.getElementById('semDemanda').hidden = false;
        await carregarPicker();
        return;
      }
      document.getElementById('comDemanda').hidden = false;
      document.getElementById('linkDemanda').href = '/ui/demanda-detalhe?id=' + encodeURIComponent(ID);
      await carregarLista();
    }
    carregar();
  </script>
</body>
</html>
